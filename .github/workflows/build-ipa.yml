name: Build iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build app and keyboard
        run: bash ThomTroll/scripts/build-ipa.sh

      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: ThomTroll-IPA
          path: ThomTroll/dist/ThomTroll-unsigned.ipa
          if-no-files-found: error
